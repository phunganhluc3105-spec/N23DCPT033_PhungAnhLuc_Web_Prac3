# fly.toml app configuration file generated for backend-rolling-beacon-7727 on 2026-10-06T17:28:17+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-rolling-beacon-7727'
primary_region = 'sin'

[build]

[deploy]
  strategy = 'immediate'

[env]
  PORT = '5000'
  NODE_ENV = 'production'
  FRONTEND_URL = 'https://n23-dcpt-033-phung-anh-luc-web-prac-opal.vercel.app'
  DATA_PATH = '/data/data.json'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'shop_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
  memory_mb = 256

